name: MIPC integration validation
on:
  pull_request:
    paths:
      - "custom_components/mipc_camera/**"
      - "hacs.json"
      - "docs/MIPC_HA_INTEGRATION.md"
  push:
    branches:
      - feature/hacs-mipc-camera
    paths:
      - "custom_components/mipc_camera/**"
      - "hacs.json"
      - "docs/MIPC_HA_INTEGRATION.md"
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Check Python syntax and JSON manifests
        run: |
          python -m compileall -q custom_components/mipc_camera
          python -m json.tool custom_components/mipc_camera/manifest.json >/dev/null
          python -m json.tool custom_components/mipc_camera/strings.json >/dev/null
          python -m json.tool custom_components/mipc_camera/translations/en.json >/dev/null
          python -m json.tool hacs.json >/dev/null
